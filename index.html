<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14201b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="stylesheet" href="assets/style.css?v=13">
  <link rel="stylesheet" href="assets/report.css?v=2">
  <link rel="stylesheet" href="assets/roadmap.css?v=4">
  <title>Gestão Restaurante</title>
</head>
<body>
  <div id="login" class="login" hidden><div class="login-card">
    <span class="eyebrow">MVP · OPERAÇÃO</span><h1>Gestão Restaurante</h1>
    <p>Custos, fichas técnicas e perdas em um só lugar.</p>
    <form id="login-form"><label>E-mail<input name="email" type="email" required autocomplete="username"></label>
      <label>Senha<input name="senha" type="password" required autocomplete="current-password"></label>
      <button type="submit">Entrar</button><small id="login-error" class="login-error" role="alert"></small>
    </form>
  </div><button type="button" class="install-app-button login-install-button" data-install-app>Baixar aplicativo</button></div>
  <div id="app" hidden>
    <aside><div class="brand">🍽️ <b>Gestão<br>Restaurante</b></div><nav>
      <button data-view="dashboard" class="active">⌂ Início</button>
      <button data-view="products">◈ Produtos</button>
      <button data-view="suppliers">♧ Fornecedores</button>
      <button data-view="recipes">◇ Fichas técnicas</button>
      <button data-view="purchases">▣ Compras</button>
      <button data-view="stock">▤ Estoque</button>
      <button data-view="inventory">▦ Inventário</button>
      <button data-view="production">♨ Produção</button>
      <button data-view="buffet">☼ Buffet / café</button>
      <button data-view="waste">⚠ Desperdícios</button>
      <button data-view="breakages">♧ Quebras</button>
      <button data-view="reports">▤ Relatórios</button>
      <button data-view="report_history">◷ Histórico de relatórios</button>
      <button data-view="filters">⌕ Filtros</button>
      <button data-view="settings">⚙ Custos</button>
      <button data-view="users">♙ Usuários</button>
    </nav></aside>
    <main><header><div><span class="eyebrow">VISÃO GERAL</span><h1 id="page-title">Início</h1></div><div class="header-actions"><span id="user-name"></span><button type="button" class="install-app-button" data-install-app>Baixar aplicativo</button><button id="logout" class="logout">Sair</button></div></header><section id="view"></section></main>
  </div>
  <dialog id="install-dialog" class="install-dialog" aria-labelledby="install-title" aria-describedby="install-message">
    <div class="install-dialog-content">
      <span class="eyebrow">GESTÃO RESTAURANTE</span>
      <h2 id="install-title">Instalar aplicativo</h2>
      <p id="install-message"></p>
      <div id="install-instructions" class="install-instructions" hidden></div>
      <div class="install-dialog-actions">
        <button type="button" id="install-dismiss" class="add-btn">Agora não</button>
        <button type="button" id="install-confirm" class="install-app-button" hidden>Instalar</button>
      </div>
    </div>
  </dialog>
  <div id="toast"></div><script src="assets/app.js?v=15"></script>
</body>
</html>
